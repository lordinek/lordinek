name: Latest YouTube videos

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: YOUTUBE
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCiaVH23bCELFUxUJjYrRcMA"
          max_post_count: 3
          template: '<a href="$url"><img width="30%" src="https://i.ytimg.com/vi/$videoId/mqdefault.jpg" alt="$title" /></a> '
          custom_tags: "videoId/yt:videoId/"
          commit_message: "Update latest YouTube videos"
          committer_username: lordinek
          committer_email: 87543313+lordinek@users.noreply.github.com
